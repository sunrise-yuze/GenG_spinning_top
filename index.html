<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>GEN.G 陀螺</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Layout: one full-bleed stage. Masthead top-left, small credits top-right, control dock bottom-centre. */
:root{
  color-scheme:dark;
  --ink:#0a0907;            /* stage black, warm */
  --panel:rgba(21,18,12,.84);
  --line:#3a3120;           /* hairlines */
  --accent:#aa8b30;         /* the selected team's colour: Gen.G gold by default */
  --accent-hi:#e6c96e;      /* the same colour, lit */
  --paper:#f2ebd9;          /* text */
  --mute:#a2977b;           /* secondary text */
  --display:"Chakra Petch","PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --body:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
}
#stage[data-team="tes"]{--accent:#e23c22;--accent-hi:#ff8266;--line:#40261f}   /* Top Esports red */
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--body);font-size:14px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:relative;height:100%;overflow:hidden;-webkit-user-select:none;user-select:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#fx{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}

.mast{position:absolute;inset:0 0 auto;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
  padding-block:18px 0;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));pointer-events:none}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{width:36px;height:36px;flex:none;fill:var(--accent)}
h1{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(20px,2.6vw,28px);letter-spacing:.06em;line-height:1.1;white-space:nowrap}
h1 b{font-family:var(--body);font-weight:700;color:var(--accent-hi);letter-spacing:.12em;margin-left:.2em}
.brand p{margin:3px 0 0;font-size:12px;color:var(--mute);letter-spacing:.1em}
.aside{display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.credits{margin:3px 0 0;text-align:right;font-size:11px;line-height:1.75;color:var(--mute);letter-spacing:.08em}
.snd{pointer-events:auto;padding:2px 9px;border:1px solid var(--line);font-size:11px;letter-spacing:.1em;color:var(--mute)}
.snd[aria-pressed="true"]{border-color:var(--accent);color:var(--accent-hi)}

.foot{position:absolute;inset:auto 0 0;display:flex;flex-direction:column;align-items:center;gap:12px;
  padding-block:0 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.dock{pointer-events:auto;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px 18px;padding:10px 14px;
  background:var(--panel);border:1px solid var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
button{font:inherit;color:inherit;background:none;border:0;margin:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent-hi);outline-offset:2px}
.teams{display:flex;border:1px solid var(--line)}
.teams button{padding:7px 13px;font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.08em;color:var(--mute);transition:background .15s,color .15s}
.teams button + button{border-left:1px solid var(--line)}
.teams button:hover{color:var(--paper)}
.teams button[aria-pressed="true"]{background:var(--accent);color:var(--ink)}
.speed{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:12px;letter-spacing:.14em}
.speed .rps{font-family:var(--display);font-size:13px;letter-spacing:.04em;color:var(--paper);min-width:5.2em;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:clamp(110px,20vw,190px);height:24px;margin:0;background:none;cursor:pointer}
/* the slider is the speedometer: the thumb sits at the top's actual speed, and dragging it sets that speed by hand */
input[type=range]::-webkit-slider-runnable-track{height:3px;background:linear-gradient(90deg,var(--accent) var(--live,0%),var(--line) var(--live,0%))}
input[type=range]::-moz-range-track{height:3px;background:linear-gradient(90deg,var(--accent) var(--live,0%),var(--line) var(--live,0%))}
/* slider thumb is an emblem outline: flat top, 45-degree point */
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:16px;margin-top:-7px;background:var(--accent-hi);clip-path:polygon(0 0,100% 0,100% 52%,50% 100%,0 52%)}
input[type=range]::-moz-range-thumb{width:14px;height:16px;border:0;border-radius:0;background:var(--accent-hi);clip-path:polygon(0 0,100% 0,100% 52%,50% 100%,0 52%)}
.spin{width:30px;height:20px;flex:none;fill:none;stroke:var(--accent-hi);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:opacity .2s}
.spin .head{fill:var(--accent-hi);stroke:none}
.whips{display:flex;border:1px solid var(--accent)}
.whips button{display:flex;align-items:center;gap:7px;padding:7px 14px;background:var(--accent);color:var(--ink);font-weight:700;letter-spacing:.14em;transition:background .15s,transform .08s}
.whips button + button{border-left:1px solid var(--ink)}
.whips button:hover{background:var(--accent-hi)}
.whips button:active{transform:translateY(1px)}
.whips svg{width:7px;height:10px;flex:none;fill:currentColor}
.view{padding:7px 14px;border:1px solid var(--line);color:var(--mute);letter-spacing:.14em;transition:color .15s,border-color .15s}
.view:hover{color:var(--paper)}
.view[aria-pressed="true"]{border-color:var(--accent);color:var(--accent-hi)}
#fallback{position:absolute;inset:0;margin:auto;height:max-content;max-width:26em;padding:0 20px;text-align:center;color:var(--mute)}
.no-ui .mast,.no-ui .foot{display:none}
@media (max-width:520px){
  .credits{font-size:10px}
  .brand svg{width:30px;height:30px}
}
</style>
</head>
<body>
<div id="stage" data-team="geng">
  <canvas id="gl" aria-label="由战队队徽旋转而成的三维陀螺；在陀螺上向左或向右快速划过可以抽鞭，顺着转向加速，逆着转向减速或反转，不抽它会自己慢慢停下"></canvas>
  <canvas id="fx" aria-hidden="true"></canvas>

  <div class="mast">
    <div class="brand">
      <svg id="markG" viewBox="0.6 21.6 66.95 57.6" aria-hidden="true">
        <path id="half" d="m1.83 22.321h28.684c0.27528 0 0.51385 0.22022 0.51385 0.51386v8.9374c0 0.27528-0.22022 0.51386-0.51385 0.51386h-18.737c-0.27528 0-0.51386 0.22022-0.51386 0.51386v12.424c0 0.12846 0.0551 0.25693 0.14682 0.36704l8.7906 8.8273c0.33033 0.33034 0.88089 0.09176 0.88089-0.36704v-8.4052c0-0.12846-0.0551-0.25693-0.14682-0.36704l-5.1752-5.2303c-0.31199-0.33034-0.0918-0.86254 0.36704-0.86254h14.388c0.27528 0 0.51385 0.23857 0.51385 0.51386v38.227c0 0.4588-0.55055 0.67902-0.88089 0.36704l-28.666-28.556c-0.0918-0.09176-0.14682-0.22022-0.14682-0.36704v-26.537c-0.0184-0.27528 0.22023-0.51386 0.49551-0.51386"/>
        <use href="#half" transform="matrix(-1 0 0 1 68.1484 0)"/>
      </svg>
      <svg id="markT" viewBox="-1.06 -0.06 2.12 2.87" aria-hidden="true" hidden><path id="tesPath" d=""/></svg>
      <div>
        <h1><span id="team">GEN.G</span><b>陀螺</b></h1>
        <p>队徽绕中轴转一圈</p>
      </div>
    </div>
    <div class="aside">
      <p class="credits">甩鞭：顺转向加速，逆向减速<br>拖底盘换视角 · 滚轮缩放<br>粉丝自制 · 非官方</p>
      <button type="button" class="snd" id="snd" aria-pressed="true">声音 开</button>
    </div>
  </div>

  <div class="foot" id="foot">
    <div class="dock">
      <div class="teams" role="group" aria-label="换陀螺">
        <button type="button" id="t-geng" aria-pressed="true">GEN.G</button>
        <button type="button" id="t-tes" aria-pressed="false">TES</button>
      </div>
      <label class="speed" for="speed">
        <input type="range" id="speed" min="0" max="100" step="0.5" value="0" aria-label="转速，拖动可以直接设定">
        <svg class="spin" id="dir" viewBox="0 0 30 20" aria-hidden="true"><path d="M19.5 13.9C24.5 13 28 11 28 8.6 28 5.5 22.2 3 15 3S2 5.5 2 8.6c0 2.5 3.8 4.6 9 5.4"/><path class="head" d="M11 10.4l7 4-7 4z"/></svg>
        <span class="rps" id="rps" aria-hidden="true"></span>
      </label>
      <div class="whips" role="group" aria-label="抽一鞭">
        <button type="button" id="whipL" aria-label="向左抽一鞭" title="也可以按 ← 键"><svg viewBox="0 0 8 10" aria-hidden="true"><path d="M8 0L0 5l8 5z"/></svg>抽</button>
        <button type="button" id="whipR" aria-label="向右抽一鞭" title="也可以按 → 键">抽<svg viewBox="0 0 8 10" aria-hidden="true"><path d="M0 0l8 5-8 5z"/></svg></button>
      </div>
      <button type="button" class="view" id="side" aria-pressed="false">正侧面</button>
      <button type="button" class="view" id="glass" aria-pressed="true" title="开：透明水晶外壳；关：磨砂纯色">水晶</button>
    </div>
  </div>

  <p id="fallback" hidden>这个页面需要 WebGL 才能显示三维陀螺。请换一个支持 WebGL 的浏览器，或者检查网络后刷新。</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
'use strict';
document.documentElement.lang = 'zh-CN';
var $ = function (id) { return document.getElementById(id); };
var stageEl = $('stage'), canvas = $('gl');
function fail() { $('fallback').hidden = false; $('foot').hidden = true; }
if (!window.THREE) { fail(); return; }
var T3 = THREE, renderer;
try { renderer = new T3.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false, powerPreference: 'high-performance' }); }
catch (err) { fail(); return; }

var q = new URLSearchParams(location.search);
function qn(k, d) { var v = parseFloat(q.get(k)); return isNaN(v) ? d : v; }
var DEG = Math.PI / 180, TAU = Math.PI * 2, HALF_PI = Math.PI / 2;
var reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
if (q.get('ui') === '0') stageEl.classList.add('no-ui');

renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputEncoding = T3.sRGBEncoding;
renderer.toneMapping = T3.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.physicallyCorrectLights = true;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T3.PCFSoftShadowMap;
renderer.setClearColor(0x0a0907, 1);

/* ---------- 1. Two emblems, each reduced to its right half: a closed outline in (radius, height) ----------
   Every outline point starts a segment of one kind: 'o' faces the outside world, 'i' lines a cavity,
   'a' lies on the axis and makes no surface. Heights start at the tip; the tops are sized in world units. */
function parsePath(d) {
  var tok = d.match(/[a-zA-Z]|-?(?:\d+\.?\d*|\.\d+)(?:e[-+]?\d+)?/g), i = 0, cmd = '', x = 0, y = 0, out = [];
  function num() { return parseFloat(tok[i++]); }
  while (i < tok.length) {
    if (/^[a-zA-Z]$/.test(tok[i])) cmd = tok[i++];
    if (cmd === 'm') { x += num(); y += num(); cmd = 'l'; }
    else if (cmd === 'h') { var hx = x + num(); out.push([[x, y], [hx, y]]); x = hx; }
    else if (cmd === 'v') { var vy = y + num(); out.push([[x, y], [x, vy]]); y = vy; }
    else if (cmd === 'l') { var lx = x + num(), ly = y + num(); out.push([[x, y], [lx, ly]]); x = lx; y = ly; }
    else if (cmd === 'c') { var a = [x + num(), y + num()], b = [x + num(), y + num()], p = [x + num(), y + num()]; out.push([[x, y], a, b, p]); x = p[0]; y = p[1]; }
    else break;
  }
  return out;
}

/* Gen.G: read straight from the SVG path in the masthead */
function gengDef() {
  var segs = parsePath($('half').getAttribute('d'));
  var XC = 34.0742, CN = 7, raw = [];           /* XC: the emblem's mirror axis, in SVG units */
  segs.forEach(function (s, si) {
    if (s.length === 2) { raw.push({ x: s[0][0], y: s[0][1], seg: si }); return; }
    for (var k = 0; k < CN; k++) {
      var t = k / CN, u = 1 - t;
      raw.push({
        x: u * u * u * s[0][0] + 3 * u * u * t * s[1][0] + 3 * u * t * t * s[2][0] + t * t * t * s[3][0],
        y: u * u * u * s[0][1] + 3 * u * u * t * s[1][1] + 3 * u * t * t * s[2][1] + t * t * t * s[3][1],
        seg: si
      });
    }
  });
  var minX = Infinity, maxY = -Infinity, minY = Infinity, rMin = Infinity;
  raw.forEach(function (p) { minX = Math.min(minX, p.x); maxY = Math.max(maxY, p.y); minY = Math.min(minY, p.y); });
  var S = XC - minX;                            /* outer radius becomes 1 */
  /* path segments that face outward: top face, tip, cone, outer wall and their fillets */
  var OUTER = { 0: 1, 1: 1, 17: 1, 18: 1, 19: 1, 20: 1, 21: 1 };
  var pts = raw.map(function (p) {
    var r = (XC - p.x) / S; rMin = Math.min(rMin, r);
    return { r: r, y: (maxY - p.y) / S, kind: OUTER[p.seg] ? 'o' : 'i' };
  });
  var H = (maxY - minY) / S, sh = (maxY - 49.74) / S;   /* sh: where the wall turns into the cone */
  return {
    id: 'geng', name: 'GEN.G', pts: pts, height: H, radius: 1, lid: true,
    thick: 2 * rMin,                            /* each plate is exactly as thick as the emblem's centre slit */
    body: [sh, H], sil: [[-1, H], [1, H], [1, sh], [0.1, 0], [-0.1, 0], [-1, sh]],
    color: 0xd2a63c, rim: [1.0, 0.80, 0.42], ring: 0xaa8b30, tint: 0xa9862c, look: 'crystal'
  };
}

/* Top Esports: a hexagonal shield with a T cut out of it, measured off the emblem (half-width = 1, tip at 0).
   The bar of the T becomes a closed chamber; its stem becomes a bore that runs down and out through the tip. */
var TES_H = 2.744, TES_SLIT = 0.0977;
/* [radius, height, kind, solid]: "solid" marks the stretches of the outer rim that sit level with solid emblem on the
   centre line (above the bar, and between bar and stem); the rest is level with the cut-outs. See slab() below. */
var TES_OUTLINE = [
  [0, TES_H, 'o', 1], [1, 2.099, 'o', 1], [1, 1.798, 'o', 0], [1, 1.627, 'o', 1], [1, 1.39, 'o', 0],   /* apex, shoulder, down the wall */
  [1, 1.223, 'o', 0],                                                      /* lower corner, then the long slope to the tip */
  [TES_SLIT, 0, 'i'], [TES_SLIT, 1.429, 'i'], [0, 1.351, 'a'],             /* the stem: up from the tip to its notched top */
  [0, 1.594, 'i'], [0.0907, 1.660, 'i'], [0.472, 1.660, 'i'], [0.658, 1.798, 'i'], [0, 1.798, 'a']   /* the bar */
];
function tesDef() {
  var k = 0.74;                                 /* scaled so it stands about as tall on stage as the Gen.G top is wide */
  return {
    id: 'tes', name: 'TES', height: TES_H * k, radius: k, lid: false, thick: 2 * TES_SLIT * k,
    pts: TES_OUTLINE.map(function (s) { return { r: s[0] * k, y: s[1] * k, kind: s[2], solid: !!s[3] }; }),
    body: [1.223 * k, 2.099 * k],
    sil: [[0, TES_H * k], [k, 2.099 * k], [k, 1.223 * k], [TES_SLIT * k, 0], [-TES_SLIT * k, 0], [-k, 1.223 * k], [-k, 2.099 * k]],
    color: 0xff3e24, rim: [1.0, 0.52, 0.40], ring: 0xe23c22, tint: 0xc22a17, look: 'frost'
  };
}
(function drawTesMark() {                       /* the masthead icon for TES comes from the same outline */
  var d = '', sx, i;
  for (sx = 1; sx >= -1; sx -= 2) {
    for (i = 0; i < TES_OUTLINE.length; i++) d += (i ? 'L' : 'M') + (sx * TES_OUTLINE[i][0]).toFixed(3) + ' ' + (TES_H - TES_OUTLINE[i][1]).toFixed(3);
    d += 'Z';
  }
  $('tesPath').setAttribute('d', d);
})();

/* ---------- 2. Studio lighting, written once in GLSL and used for both metal and crystal ---------- */
var STUDIO = [
  'float band(float x, float c, float hw, float soft){ return 1.0 - smoothstep(hw, hw + soft, abs(x - c)); }',
  'float aband(float a, float c, float hw, float soft){ float d = abs(a - c); d = min(d, 6.2831853 - d); return 1.0 - smoothstep(hw, hw + soft, d); }',
  'vec3 studio(vec3 d){',
  '  float el = asin(clamp(d.y, -1.0, 1.0));',
  '  float az = atan(d.x, d.z);',
  '  vec3 warm = vec3(1.0, 0.90, 0.74), white = vec3(1.0, 0.97, 0.92), cool = vec3(0.78, 0.86, 1.0);',
  '  vec3 c = vec3(0.02, 0.018, 0.015);',
  '  c += warm * 0.16 * band(el, 0.15, 0.35, 0.5);',
  '  c += vec3(0.60, 0.46, 0.26) * 0.5 * (1.0 - smoothstep(-1.0, -0.05, el));',
  '  c += white * 1.45 * aband(az, -0.75, 0.35, 0.30) * band(el, 0.50, 0.32, 0.22);',
  '  c += warm * 0.6 * aband(az, 0.15, 0.9, 0.5) * band(el, -0.05, 0.45, 0.35);',
  '  c += cool * 7.0 * aband(az, 2.25, 0.07, 0.05) * band(el, 0.2, 0.7, 0.15);',
  '  c += warm * 7.0 * aband(az, -2.45, 0.07, 0.05) * band(el, 0.2, 0.7, 0.15);',
  '  c += vec3(1.0, 0.85, 0.6) * 0.35 * aband(az, 3.14159, 0.5, 0.4) * band(el, 0.22, 0.2, 0.25);',
  '  c += white * 1.6 * smoothstep(1.0, 1.3, el);',
  '  return c;',
  '}'
].join('\n');

var scene = new T3.Scene();
(function makeEnvironment() {
  var envScene = new T3.Scene();
  envScene.add(new T3.Mesh(new T3.SphereGeometry(10, 48, 24), new T3.ShaderMaterial({
    side: T3.BackSide, depthWrite: false,
    vertexShader: 'varying vec3 vDir;\nvoid main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: STUDIO + '\nvarying vec3 vDir;\nvoid main(){\n gl_FragColor = vec4(studio(normalize(vDir)), 1.0);\n#include <encodings_fragment>\n}'
  })));
  var pmrem = new T3.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(envScene, 0, 0.1, 50).texture;
  pmrem.dispose();
})();
renderer.autoClear = false;
renderer.shadowMap.autoUpdate = false;

/* ---------- 3. From an outline to a top: a crystal solid of revolution with two crossed emblem plates inside ---------- */
function lin(hex) { return new T3.Color(hex).convertSRGBToLinear(); }
function crystalMaterial(refl, rim, body, rimColor) {
  return new T3.ShaderMaterial({
    transparent: true, depthWrite: false, side: T3.DoubleSide,
    polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -2,   /* glass always wins where it is flush with a plate edge */
    blending: T3.CustomBlending, blendEquation: T3.AddEquation, blendSrc: T3.OneFactor, blendDst: T3.OneMinusSrcAlphaFactor,
    uniforms: { uRefl: { value: refl }, uRim: { value: rim }, uBody: { value: body }, uRimColor: { value: rimColor } },
    vertexShader: [
      'varying vec3 vN; varying vec3 vW;',
      'void main(){',
      '  vec4 wp = modelMatrix * vec4(position, 1.0);',
      '  vW = wp.xyz; vN = mat3(modelMatrix) * normal;',
      '  vec4 mvPosition = viewMatrix * wp;',
      '  gl_Position = projectionMatrix * mvPosition;',
      '}'
    ].join('\n'),
    fragmentShader: [
      'uniform float uRefl, uRim, uBody; uniform vec3 uRimColor;',
      'varying vec3 vN; varying vec3 vW;',
      STUDIO,
      'void main(){',
      '  vec3 N = normalize(vN), V = normalize(cameraPosition - vW);',
      '  if (dot(N, V) < 0.0) N = -N;',
      '  float ndv = clamp(dot(N, V), 0.0, 1.0);',
      '  float f5 = pow(1.0 - ndv, 5.0);',
      '  vec3 col = studio(reflect(-V, N)) * (0.04 + 0.6 * f5) * uRefl;',
      '  col += uRimColor * pow(1.0 - ndv, 2.6) * uRim;',
      '  col += vec3(0.9, 0.78, 0.5) * uBody * 0.25;',
      '  gl_FragColor = vec4(col, clamp(uBody + 0.35 * f5, 0.0, 0.85));',
      '  #include <tonemapping_fragment>',
      '  #include <encodings_fragment>',
      '}'
    ].join('\n')

  /* speedometer: thumb, track fill and readout follow the actual speed; the little orbit icon shows which way it turns */
  var av = Math.abs(st.omega), v = Math.round(200 * Math.pow(Math.min(1, av / OMEGA_MAX), 1 / 2.2)) / 2, rps = av / TAU;
  var txt = rps < 0.02 ? '停' : (rps < 1 ? rps.toFixed(2) : rps.toFixed(1)) + ' 圈/秒';
  var ds = (rps < 0.02 ? 'x' : 'o') + ((rps < 0.02 ? st.dir : st.omega) < 0 ? 'L' : 'R');
  if (ds !== gaugeDir) { gaugeDir = ds; $('dir').style.transform = ds.charAt(1) === 'L' ? 'scaleX(-1)' : ''; $('dir').style.opacity = ds.charAt(0) === 'x' ? 0.35 : 1; }
  if (v !== gaugeV) { gaugeV = v; speedEl.style.setProperty('--live', v + '%'); if (!st.hold) speedEl.value = v; }
  if (txt !== gaugeTxt) { gaugeTxt = txt; $('rps').textContent = txt; speedEl.setAttribute('aria-valuetext', txt); }
}

/* ---------- 8. Start ---------- */
var startTeam = q.get('team');
if (!tops[startTeam]) { try { startTeam = localStorage.getItem('geng-top-team'); } catch (err) {} }
if (!tops[startTeam]) startTeam = 'geng';
['geng', 'tes'].forEach(function (k) {             /* each top remembers whether its crystal was on */
  var saved = null;
  try { saved = localStorage.getItem('geng-top-look-' + k); } catch (err) {}
  if (saved) tops[k].setLook(saved);
});
if (q.get('look')) tops[startTeam].setLook(q.get('look'));
setTeam(startTeam, true);
setSound(soundOn);
st.az = qn('az', 0) * DEG; st.el = qn('el', 13) * DEG; st.zoom = qn('zoom', 1);
st.phi = -st.az;                        /* the page opens at rest with a plate squarely facing the viewer */
if (q.get('phi') !== null) { st.frozen = true; st.phi = qn('phi', 0) * DEG - st.az; }
if (qn('speed', 0) > 0) st.omega = sliderToOmega(qn('speed', 0));
tick(1e-3);                                         /* places the camera and measures the silhouette */
/* test hooks: ?team=tes, ?speed=N starts it spinning, ?hits=N lands N lashes, ?auto=1 throws one (negative: to the left),
   ?ff=N fast-forwards N frames, ?debug=1 exposes the state */
var nHits = qn('hits', 0), nAuto = qn('auto', 0), i;
for (i = Math.abs(nHits); i > 0; i--) hit(0.8, nHits < 0 ? -1 : 1, sil.cx, sil.cy);
if (nAuto) { demoN = 2; autoLash(nAuto < 0 ? -1 : 1); }
for (i = qn('ff', 0); i > 0; i--) tick(1 / 60);
if (q.get('debug') === '1') window.__top = { tick: tick, st: st, rope: rope, sil: sil, zoneAt: zoneAt, setTeam: setTeam };
$('side').setAttribute('aria-pressed', String(Math.abs(st.el) < 0.012));
requestAnimationFrame(frame);
})();
</script>
